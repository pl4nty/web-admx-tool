name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. a Renovate branch that gets rebased).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post/update the screenshot preview comment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # The committed admx/ ADMX+ADML files are enough to build the site, so this
      # skips the network-heavy `build:data` step and catches build regressions
      # (e.g. from dependency bumps) directly.
      - name: Build site
        run: pnpm exec astro build
        env:
          NODE_ENV: production

      # The build emits root-absolute URLs (/_astro/..., /data/...), hydrates via
      # ES modules and fetches /data/*.json at runtime, so opening index.html over
      # file:// can never work — assets resolve against the filesystem root and the
      # null origin blocks both module scripts and fetch. Ship the how-to-serve
      # note inside the artifact, where someone who hit a blank page will look.
      - name: Add serve instructions to build output
        run: |
          cat > dist/README.md <<'EOF'
          # Previewing this build

          This is a static site, but it must be served over HTTP — opening
          `index.html` directly from disk (`file://`) will show a blank or broken
          page, because the asset URLs are absolute, the scripts are ES modules,
          and the sidebar/search fetch JSON at runtime. All three are blocked
          under `file://`.

          From this folder, run whichever you have:

              npx serve .
              python3 -m http.server 4321
              php -S localhost:4321

          Then open the URL it prints (e.g. <http://localhost:4321/en-us/>).
          EOF

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Screenshot preview
        run: |
          pnpm preview --port 4321 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/en-us/ && break
            sleep 1
          done
          BASE_URL=http://localhost:4321 pnpm screenshot
          kill "$PREVIEW_PID" 2>/dev/null || true

      # `archive: false` uploads each screenshot as an individual (non-zipped)
      # file, so it can be viewed/downloaded directly. It only supports one file
      # per step, and the file name becomes the artifact name.
      - name: Upload home screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: screenshots/home.png
          archive: false
          retention-days: 7

      - name: Upload policy screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: screenshots/policy.png
          archive: false
          retention-days: 7

      - name: Comment preview links on PR
        # Skip on fork PRs, where GITHUB_TOKEN is read-only and cannot comment.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- build-preview -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### 🔎 Build preview',
              '',
              'The site built successfully. Download the artifacts from this run to preview the changes:',
              '',
              `- 📸 [**Screenshots**](${runUrl}) — \`home.png\` and \`policy.png\` artifacts`,
              `- 🌐 [**Built site**](${runUrl}) — \`dist\` artifact. Unzip it and serve it over HTTP (\`npx serve .\` or \`python3 -m http.server 4321\`), then open <http://localhost:4321/en-us/>. Opening \`index.html\` straight from disk won't work — see the \`README.md\` in the artifact.`,
              '',
              `<sub>Updated for commit ${context.sha.slice(0, 7)} · [view run](${runUrl})</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
